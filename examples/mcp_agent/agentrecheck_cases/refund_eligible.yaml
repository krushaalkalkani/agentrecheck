# other MCP calls are allowed around it.
id: refund_eligible
name: Refund for an eligible order
trace_id: tr_228b00e10263
input:
  args:
  - I'd like a refund for order A1001, the mouse arrived damaged.
  kwargs: {}
baseline:
  tool_sequence:
  - lookup_order
  - issue_refund
  cost_usd: 0.0002283
  latency_ms: 354.787
  steps: 5
  output: Your refund of $49.00 for order A1001 has been issued (reference R-A1001).
assertions:
