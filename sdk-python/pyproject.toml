[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrecheck"
version = "0.1.0"
description = "CI/CD for AI agents: record agent runs, snapshot them into test cases, and catch regressions before they ship."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AgentRecheck" }]
keywords = ["llm", "agents", "testing", "evals", "ci", "regression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
agentrecheck = "agentrecheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrecheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/agentrecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentrecheck"]
